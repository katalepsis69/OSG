name: Release Build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Single-File Executable
        run: dotnet publish src/BTA_OSG_DocumentTracking -c Release -o ./dist

      - name: Publish Release to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME -match '^v\d') { $env:GITHUB_REF_NAME } else { "v2.1.$env:GITHUB_RUN_NUMBER" }
          gh release create $tag dist/BTA_OSG_DocumentTracking.exe --title "$tag" --notes "Automated release build $tag" --generate-notes
