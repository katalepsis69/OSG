# BTA OSG Portal: optional containerized stack (thesis/demo only).
# Before running: create a .env beside this file (never committed) with real values:
#   MYSQL_ROOT_PASSWORD=<strong random>
#   MYSQL_PASSWORD=<strong random>
#   BRIDGE_SECRET_KEY=<64 hex chars, must match the desktop bridge key>
#   BREVO_API_KEY=<Brevo key>
# Both published ports bind 127.0.0.1 only: the stack is reachable from this machine
# (and, if you start the Cloudflare tunnel, from the tunnel), not from the LAN.
services:
  db:
    image: mysql:8.0
    container_name: bta-portal-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: osg
      MYSQL_USER: portal
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./portal/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - portal_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    image: php:8.2-apache
    container_name: bta-portal-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:80"
    volumes:
      - ./portal:/var/www/portal
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/portal/public
      # The web container reaches the database through the compose network by service
      # name; config.php reads these env vars, so no hand-editing is needed.
      PORTAL_DB_HOST: db
      PORTAL_DB_PORT: "3306"
      PORTAL_DB_NAME: osg
      PORTAL_DB_USER: portal
      PORTAL_DB_PASS: ${MYSQL_PASSWORD}
      BRIDGE_SECRET_KEY: ${BRIDGE_SECRET_KEY:?set BRIDGE_SECRET_KEY in .env}
      PORTAL_BASE_URL: http://localhost:8085
      BREVO_API_KEY: ${BREVO_API_KEY:-}
    entrypoint: >
      bash -c "
        (php -m | grep -qi pdo_mysql || docker-php-ext-install pdo pdo_mysql 2>/dev/null || true) &&
        cp /var/www/portal/deploy/apache-portal.conf /etc/apache2/sites-available/000-default.conf &&
        sed -ri -e 's!<Directory /var/www.*!<Directory /var/www/>!g' /etc/apache2/apache2.conf &&
        a2enmod rewrite &&
        exec apache2-foreground
      "
    depends_on:
      db:
        condition: service_healthy

volumes:
  portal_db_data:
