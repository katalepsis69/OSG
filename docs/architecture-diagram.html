<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BTA OSG Document Tracking - Public Portal to Office System Architecture</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --fg: #172033;
      --muted: #5b6475;
      --line: #64748b;
      --neutral: #e2e8f0;
      --input: #bfdbfe;
      --process: #c7d2fe;
      --storage: #99f6e4;
      --external: #fde68a;
      --risk: #fecaca;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --fg: #e5e7eb;
        --muted: #a3adbd;
        --line: #94a3b8;
        --neutral: #334155;
        --input: #1d4ed8;
        --process: #4338ca;
        --storage: #0f766e;
        --external: #92400e;
        --risk: #991b1b;
      }
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      max-width: 860px;
      margin: 24px auto;
      padding: 0 16px;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .title {
      font-size: 20px;
      font-weight: 650;
      fill: var(--fg);
    }
    .subtitle {
      font-size: 13px;
      fill: var(--muted);
    }
    .label {
      font-size: 14px;
      font-weight: 600;
      fill: var(--fg);
    }
    .small {
      font-size: 11.5px;
      fill: var(--muted);
    }
    .flow-label {
      font-size: 11.5px;
      font-weight: 600;
      fill: var(--muted);
    }
    .node {
      stroke: var(--line);
      stroke-width: 1.2;
    }
    .neutral {
      fill: var(--neutral);
    }
    .input {
      fill: var(--input);
    }
    .process {
      fill: var(--process);
    }
    .storage {
      fill: var(--storage);
    }
    .external {
      fill: var(--external);
    }
    .risk {
      fill: var(--risk);
    }
    .edge {
      stroke: var(--line);
      stroke-width: 1.5;
      fill: none;
    }
    .zone {
      fill: none;
      stroke: var(--line);
      stroke-width: 1;
      stroke-dasharray: 6 5;
      opacity: 0.75;
    }
    .zone-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      fill: var(--muted);
    }
    .legend-text {
      font-size: 12px;
      fill: var(--fg);
    }
    .fact-title {
      font-size: 12.5px;
      font-weight: 700;
      fill: var(--fg);
    }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 840 1000" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--line)" />
        </marker>
      </defs>

      <!-- Header -->
      <g>
        <text class="title" x="420" y="32" text-anchor="middle">Public Portal to Office System Architecture</text>
        <text class="subtitle" x="420" y="52" text-anchor="middle">How Citizens Submit Document Requests and Track Progress Safely</text>
      </g>

      <!-- Zones (Boundaries with ample spacing to prevent overlapping) -->
      <g>
        <!-- Zone 1: Public External Space (Top) -->
        <rect class="zone" x="40" y="75" width="760" height="275" rx="10" ry="10" />
        <text class="zone-title" x="55" y="96">1. Public Access (Phone &amp; Browser Ingress)</text>

        <!-- Zone 2: Secure Bridge Connection (Middle) -->
        <rect class="zone" x="40" y="410" width="760" height="150" rx="10" ry="10" />
        <text class="zone-title" x="55" y="431">2. Secure Bridge (Protected Data Exchange)</text>

        <!-- Zone 3: Internal Office System (Bottom) -->
        <rect class="zone" x="40" y="620" width="760" height="240" rx="10" ry="10" />
        <text class="zone-title" x="55" y="641">3. Internal Office System (System of Record)</text>
      </g>

      <!-- Flow Connectors (Rendered before nodes to keep lines behind shapes) -->
      <g class="connectors">
        <!-- 1. Requester down to Submission Page (inside Zone 1) -->
        <path class="edge" marker-end="url(#arrow)" d="M 235 190 L 235 250" />
        <text class="flow-label" x="245" y="222">1. Submit request via phone or PC</text>

        <!-- 2. Submission Page down to Secure Importer (crossing gap between Zone 1 & 2) -->
        <path class="edge" marker-end="url(#arrow)" d="M 235 330 L 235 460" />
        <text class="flow-label" x="245" y="385">2. Queue request securely</text>

        <!-- 3. Secure Importer down to Internal Office System (crossing gap between Zone 2 & 3) -->
        <path class="edge" marker-end="url(#arrow)" d="M 235 540 L 235 655" />
        <text class="flow-label" x="245" y="595">3. Import into office queue</text>

        <!-- 4. Internal Office System down to Central Archive (inside Zone 3) -->
        <path class="edge" marker-end="url(#arrow)" d="M 420 735 L 420 765" />
        <text class="flow-label" x="430" y="752">Save official record</text>

        <!-- 5. Internal Office System up to Status Publisher (crossing gap between Zone 3 & 2) -->
        <path class="edge" marker-end="url(#arrow)" d="M 605 655 L 605 540" />
        <text class="flow-label" x="615" y="595">4. Push status update</text>

        <!-- 6. Status Publisher up to Online Status Tracker (crossing gap between Zone 2 & 1) -->
        <path class="edge" marker-end="url(#arrow)" d="M 605 460 L 605 330" />
        <text class="flow-label" x="615" y="385">5. Sync public milestone</text>

        <!-- 7. Online Status Tracker up to Requester (inside Zone 1) -->
        <path class="edge" marker-end="url(#arrow)" d="M 605 250 L 605 190" />
        <text class="flow-label" x="615" y="222">6. Real-time progress lookup</text>
      </g>

      <!-- Nodes (Simplified, easy-to-understand descriptions without technical jargon) -->
      <g class="nodes">
        <!-- Zone 1 Top: Requester / Citizen -->
        <rect class="node input" x="160" y="110" width="520" height="80" rx="8" ry="8" />
        <text class="label" x="420" y="137" text-anchor="middle">Requester / Citizen (Mobile Phone or Computer)</text>
        <text class="small" x="420" y="157" text-anchor="middle">Accesses the online portal directly from a smartphone via Cloudflare Tunnel</text>
        <text class="small" x="420" y="173" text-anchor="middle">Submits document requests and receives an email verification code and tracking code</text>

        <!-- Zone 1 Middle-Left: Public Submission Page -->
        <rect class="node external" x="80" y="250" width="310" height="80" rx="8" ry="8" />
        <text class="label" x="235" y="277" text-anchor="middle">Public Request Intake Portal</text>
        <text class="small" x="235" y="297" text-anchor="middle">Collects request details and attached files</text>
        <text class="small" x="235" y="313" text-anchor="middle">Verifies identity with a 6-digit email security code</text>

        <!-- Zone 1 Middle-Right: Online Status Tracker -->
        <rect class="node external" x="450" y="250" width="310" height="80" rx="8" ry="8" />
        <text class="label" x="605" y="277" text-anchor="middle">Online Status Tracker</text>
        <text class="small" x="605" y="297" text-anchor="middle">Real-time status lookup using your tracking code</text>
        <text class="small" x="605" y="313" text-anchor="middle">Shows public milestones: Received, In Review, Completed</text>

        <!-- Zone 2 Left: Secure Request Importer -->
        <rect class="node process" x="80" y="460" width="310" height="80" rx="8" ry="8" />
        <text class="label" x="235" y="487" text-anchor="middle">Secure Request Importer</text>
        <text class="small" x="235" y="507" text-anchor="middle">Safely pulls waiting requests into the office system</text>
        <text class="small" x="235" y="523" text-anchor="middle">Guarantees no submissions are missed or duplicated</text>

        <!-- Zone 2 Right: Status Update Publisher -->
        <rect class="node process" x="450" y="460" width="310" height="80" rx="8" ry="8" />
        <text class="label" x="605" y="487" text-anchor="middle">Status Update Publisher</text>
        <text class="small" x="605" y="507" text-anchor="middle">Pushes approved status changes back to the portal</text>
        <text class="small" x="605" y="523" text-anchor="middle">Keeps confidential internal office notes strictly private</text>

        <!-- Zone 3 Top: Internal Office System -->
        <rect class="node process" x="160" y="655" width="520" height="80" rx="8" ry="8" />
        <text class="label" x="420" y="682" text-anchor="middle">Office Document Tracking System</text>
        <text class="small" x="420" y="702" text-anchor="middle">Records officers review requests, assign official tracking numbers, and route documents</text>
        <text class="small" x="420" y="718" text-anchor="middle">Tracks document movements across departments with smart card badge security</text>

        <!-- Zone 3 Bottom: Central Database & Archive -->
        <rect class="node storage" x="220" y="765" width="400" height="75" rx="8" ry="8" />
        <text class="label" x="420" y="792" text-anchor="middle">Central Office Database &amp; Secure Archive</text>
        <text class="small" x="420" y="811" text-anchor="middle">Stores all registered documents, physical file locations, and attachments</text>
        <text class="small" x="420" y="827" text-anchor="middle">Maintains a permanent, tamper-proof audit log of every action</text>
      </g>

      <!-- System Independence Fact Callout Box -->
      <g>
        <rect class="node neutral" x="40" y="875" width="760" height="68" rx="8" ry="8" />
        <text class="fact-title" x="420" y="897" text-anchor="middle">Core Rule: Full System Independence</text>
        <text class="small" x="420" y="915" text-anchor="middle">The public portal and internal office system operate on separate, isolated environments.</text>
        <text class="small" x="420" y="930" text-anchor="middle">Supporting Fact: If the portal or internet goes down, internal office tracking continues 100% normally with zero interruption.</text>
      </g>

      <!-- Legend -->
      <g>
        <rect class="node input" x="80" y="965" width="16" height="16" rx="3" ry="3" />
        <text class="legend-text" x="104" y="978">Citizen / Requester</text>

        <rect class="node external" x="260" y="965" width="16" height="16" rx="3" ry="3" />
        <text class="legend-text" x="284" y="978">Public Online Portal</text>

        <rect class="node process" x="445" y="965" width="16" height="16" rx="3" ry="3" />
        <text class="legend-text" x="469" y="978">Bridge &amp; Office System</text>

        <rect class="node storage" x="655" y="965" width="16" height="16" rx="3" ry="3" />
        <text class="legend-text" x="679" y="978">Central Database</text>
      </g>
    </svg>
  </main>
</body>
</html>
