# BTA OSG External Intake Portal: Nginx Configuration

# Rate limiting zone for public tracking queries (max 10 queries/min/IP)
limit_req_zone $binary_remote_addr zone=track_limit:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name portal.bta-osg.gov.ph; # Replace with your actual domain or VPS public IP

    # Redirect all plain HTTP traffic to secure HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.bta-osg.gov.ph; # Replace with your actual domain or VPS public IP

    # Document root points strictly to public/ subdirectory
    root /var/www/osg-portal/public;
    index index.php index.html;

    # SSL Certificates (managed by Certbot)
    # ssl_certificate /etc/letsencrypt/live/portal.bta-osg.gov.ph/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/portal.bta-osg.gov.ph/privkey.pem;

    # SSL hardening protocols and ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max upload body size (no file uploads are allowed on this portal)
    client_max_body_size 1M;

    # Main routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Public tracking rate limit
    location = /track.php {
        limit_req zone=track_limit burst=5 nodelay;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    # PHP-FPM FastCGI processing
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # Tell PHP it is serving HTTPS: session.php sets the Secure cookie flag
        # only when it sees one of these signals, so a cookie issued under this
        # TLS-terminated vhost must not go out without it.
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    }

    # Deny access to hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
